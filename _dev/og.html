<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card</title>
<!-- The link-preview card, 1200 x 630. Rendered to img/og.png by
     python _dev/og.py, with the page's own fonts and tokens: the hero as it
     settles, the ink canvas, the framed screen and its selection box. -->
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:600;src:url(../fonts/bricolage-grotesque-600-latin.woff2) format('woff2');}
@font-face{font-family:'Geist';font-weight:100 900;src:url(../fonts/geist-latin.woff2) format('woff2');}
@font-face{font-family:'Geist Mono';font-weight:100 900;src:url(../fonts/geist-mono-latin.woff2) format('woff2');}
:root{--ink:#0f1115;--ink-2:#181b21;--ink-3:#23272f;--on-ink:#f4f5f7;--on-ink-2:rgb(244 245 247 / .7);--on-ink-3:rgb(244 245 247 / .56);
  --line:rgb(244 245 247 / .12);--line-strong:rgb(244 245 247 / .24);--glow:#5fd3a5}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;background:var(--ink);overflow:hidden}
.canvas{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgb(244 245 247 / .13) 1px,transparent 1.4px);background-size:24px 24px;
  mask-image:radial-gradient(ellipse 90% 85% at 70% 45%,#000 30%,transparent 100%)}
.copy{position:absolute;left:64px;top:56px;width:600px}
.brand{display:flex;align-items:center;gap:14px;color:var(--on-ink)}
.brand svg{width:40px;height:40px}
.brand b{display:block;font:600 22px/1.1 'Bricolage Grotesque';letter-spacing:-.02em}
.brand span{display:block;font:400 15px/1.3 'Geist';color:var(--on-ink-3)}
h1{margin-top:44px;font:600 74px/1.0 'Bricolage Grotesque';letter-spacing:-.035em;color:var(--on-ink)}
h1 span{display:block}
h1 em{font-style:normal;color:var(--glow)}
p{margin-top:28px;font:400 24px/1.4 'Geist';color:var(--on-ink-2);width:540px}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;padding-top:18px;border-top:1px solid var(--line);
  font:400 18px/1 'Geist Mono';color:var(--on-ink-3)}
.stage{position:absolute;left:704px;top:118px;width:460px}
.desk{border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--ink-2);box-shadow:0 50px 90px -40px rgb(0 0 0 / .8)}
.bar{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--ink-3);font:400 13px 'Geist Mono';color:var(--on-ink-3)}
.bar i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.bar span{margin-left:6px}
.desk img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.select{position:absolute;inset:-7px;border:1px solid var(--glow)}
.select b{position:absolute;width:8px;height:8px;background:var(--ink);border:1px solid var(--glow)}
.select b:nth-child(1){top:-4px;left:-4px}.select b:nth-child(2){top:-4px;right:-4px}
.select b:nth-child(3){bottom:-4px;left:-4px}.select b:nth-child(4){bottom:-4px;right:-4px}
.size{position:absolute;bottom:calc(100% + 6px);left:-1px;padding:3px 8px;border-radius:3px;background:var(--glow);color:var(--ink);font:400 13px 'Geist Mono'}
.phone{position:absolute;left:-58px;top:120px;width:128px;padding:5px;border:1px solid var(--line-strong);border-radius:20px;background:var(--ink-2);box-shadow:0 30px 60px -24px rgb(0 0 0 / .85)}
.phone img{display:block;width:100%;aspect-ratio:390/844;object-fit:cover;object-position:top;border-radius:15px}
</style>
</head>
<body>
<div class="canvas"></div>
<div class="copy">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#f4f5f7"/><rect x="7" y="8" width="11" height="3" rx="1.5" fill="#0f1115"/><rect x="7" y="14.5" width="9" height="3" rx="1.5" fill="#0f1115"/><rect x="7" y="21" width="7" height="3" rx="1.5" fill="#0f1115"/><circle cx="22" cy="21" r="4" fill="#5fd3a5"/></svg>
    <div><b>Eslam Nasser</b><span>UI/UX design and front-end</span></div>
  </div>
  <h1><span>What you approve</span><span>in the design</span><span>is what <em>ships.</em></span></h1>
  <p>Case studies with the live sites, on a laptop and on a phone, in Arabic and English.</p>
</div>
<div class="stage">
  <div class="desk"><div class="bar"><i></i><i></i><i></i><span>mo3ta.ps</span></div><img src="../img/work/mo3ta-1200.webp" alt=""></div>
  <div class="select"><b></b><b></b><b></b><b></b><span class="size">1440 &#215; 900</span></div>
  <div class="phone"><img src="../img/work/ev/mo3ta-home-phone-600.webp" alt=""></div>
</div>
<div class="foot"><span>3 case studies, 43 projects</span><span>imsemoo.github.io/eslam-portfolio</span></div>
</body>
</html>
